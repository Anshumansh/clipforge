name: Deploy to production

on:
  push:
    branches: [main]
  # Validation-only trigger: lets build-check run on a PR before merge, so a
  # branch's readiness can be confirmed by real CI ahead of a merge/deploy
  # decision. The deploy job below is explicitly gated to an actual push to
  # main (see its `if:`), so opening or updating a PR can never itself
  # reach the SSH/redeploy step -- only build-check runs for pull_request
  # events.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-check:
    outputs:
      deploy_relevant: ${{ steps.check-deploy-relevant.outputs.relevant }}
    runs-on: ubuntu-latest
    # Dummy-but-valid-format values, job-scoped so every step sees them
    # (not just Build) — `prisma validate` and `prisma generate` both parse
    # the schema's `url = env("DATABASE_URL")` line and fail immediately if
    # the variable is merely unset, even though neither one connects to it.
    # Discovered by an actual CI run failing here (2026-08-14, PR #1,
    # run 31797082344): local verification always had .env loaded, which
    # masked this — CI has no .env file at all. None of these steps query a
    # live DB or call a real provider; a broken push (ours or the weekly
    # maintenance bot's) fails here, never reaching prod.
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      NEXTAUTH_SECRET: "ci-build-only-not-a-real-secret"
      NEXTAUTH_URL: "https://forgecut.app"
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the previous commit to diff against below. 2 is enough for
          # a normal single-commit push; a force-push or multi-commit push
          # still resolves correctly since we diff against the exact
          # before/after SHAs GitHub gives us, not HEAD~1.
          fetch-depth: 2
      # Determines whether this push touched anything that actually needs a
      # production redeploy, so the deploy job below can skip itself for a
      # docs/report-only commit -- found necessary in production: a pure
      # RELEASE_CANDIDATE_VALIDATION.md update rebuilt and restarted both
      # live containers for zero reason, the exact class of unnecessary
      # restart this check exists to prevent. Only affects the deploy job's
      # `if:` -- validation below still runs unconditionally on every push,
      # so this can never let a broken build skip its gate.
      - name: Check whether this push changed anything deploy-relevant
        id: check-deploy-relevant
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # First push to a new branch/ref -- nothing to diff against.
            # Fail open toward deploying rather than silently skipping a
            # genuine first deploy.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "No previous commit to diff (new ref) -- treating as deploy-relevant."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "Changed files in this push:"
          echo "$CHANGED"
          # Deploy-relevant = anything that isn't purely documentation/report
          # markdown or repo-meta. Everything else (app code, Dockerfile,
          # compose file, package.json/lockfile, prisma/, public/, CI
          # workflows themselves, etc.) is deploy-relevant by default --
          # this is an exclude-list, not an allow-list, so a new file type
          # nobody has taught this check about still triggers a deploy
          # rather than silently being skipped.
          NON_DOCS=$(echo "$CHANGED" | grep -vE '\.md$|^\.github/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE)/' || true)
          if [ -z "$NON_DOCS" ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No deploy-relevant files changed -- documentation only, deploy job will skip itself."
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Deploy-relevant files changed:"
            echo "$NON_DOCS"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      -        - run: npm ci
       - name: Prisma schema validation
         env:
           DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
           NEXTAUTH_SECRET: "ci-build-only-not-a-real-secret"
           NEXTAUTH_URL: "https://forgecut.app"
         run: npx prisma validate
       - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Build
        run: |
          npx prisma generate
          npm run build
      # Bundles worker/index.ts the exact same way the Dockerfile's builder stage
      # does (esbuild, not tsc) -- catches a broken worker bundle (e.g. an import
      # esbuild can't resolve, or a native-binding package that needs a new
      # --external entry) here, on a fast CI runner, instead of mid-deploy when
      # `docker build` runs the same command on the VPS. No env vars needed:
      # esbuild only statically bundles imports, it never executes app code.
      - name: Worker build
        run: npm run build:worker
      # Mocked-DB tests: covers job runners, credit ledger, Stripe webhook
      # handling (signature verification, idempotency), the /api/internal/metrics
      # route, admission control, demo quotas, cost tracking, etc. Fast, no
      # external services.
      - name: Unit tests
        run: npm test
      # Real PostgreSQL (via the embedded-postgres package -- a real local
      # binary, not a mock), separate connections, genuine concurrent
      # transactions: proves queue-claiming, lease fencing, worker admission,
      # and demo-quota enforcement are actually race-safe, and that
      # `prisma migrate deploy` succeeds against a clean database and
      # produces a schema identical to `db push`. See lib/testing/
      # integration-global-setup.ts for why this never touches a real
      # DATABASE_URL. A regression here (e.g. someone reintroducing a
      # check-then-act race, or a migration that doesn't apply cleanly)
      # fails the deploy gate the same as a broken build would.
      - name: PostgreSQL integration tests
        run: npm run test:integration

  deploy:
    needs: build-check
    # Two ways to reach this job, both requiring `main`:
    # 1. A real push to main that changed something deploy-relevant (per
    #    build-check's check-deploy-relevant step above) -- the normal path.
    # 2. An explicit workflow_dispatch -- the "intentional release action"
    #    escape hatch for redeploying with no code change (e.g. to pick up
    #    a rotated secret or VPS-side config change), deliberately
    #    independent of the path filter above.
    # A pull_request event never satisfies either branch, so a PR can still
    # never reach the SSH/redeploy step regardless of `needs:`.
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.build-check.outputs.deploy_relevant == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    # Requires this repo to have a "production" environment configured
    # (Settings -> Environments) with a required-reviewers protection rule
    # for that approval gate to actually pause the run -- an environment
    # with no protection rules behaves like no environment at all, so this
    # reference alone is inert until that's set up (an explicit, separate
    # owner action -- see PRODUCTION_DEPLOYMENT_RUNBOOK.md).
    environment: production
    # Same group for every push-to-main deploy attempt on this ref: if a
    # second push arrives while an earlier deploy for the same ref is still
    # running, cancel the older one rather than let both race to finish --
    # otherwise an older commit's SSH step finishing after a newer one's
    # would silently leave production on the older commit.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/clipforge
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            # Caddy bind-mounts a single file; git's atomic rename leaves it bound
            # to the old inode unless force-recreated (see OPERATIONS.md #17).
            docker compose up -d --force-recreate caddy
            docker image prune -f

      - name: Post-deploy health check
        id: healthcheck
        run: |
          sleep 10
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" https://forgecut.app/api/health --max-time 15 || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: health check returned $CODE, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after deploy:"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Alert on failed post-deploy health check
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          curl -sS -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"Clipforge <onboarding@resend.dev>\",\"to\":\"support@forgecut.app\",\"subject\":\"Clipforge: deploy succeeded but health check failed\",\"html\":\"<p>The deploy step completed but <code>/api/health</code> did not return 200 within 60s afterward. Check the VPS directly.</p>\"}" \
            --max-time 15 || true
