name: Deploy to production

on:
  push:
    branches: [main]
  # Validation-only trigger: lets build-check run on a PR before merge, so a
  # branch's readiness can be confirmed by real CI ahead of a merge/deploy
  # decision. The deploy job below is explicitly gated to an actual push to
  # main (see its `if:`), so opening or updating a PR can never itself
  # reach the SSH/redeploy step -- only build-check runs for pull_request
  # events.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Dummy-but-valid-format values — the build never queries a live DB or
      # calls a real provider, it just needs these present so module-level
      # client construction (Prisma, etc.) doesn't throw. A broken push
      # (ours or the weekly maintenance bot's) fails here, never reaching prod.
      - name: Prisma schema validation
        run: npx prisma validate
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          NEXTAUTH_SECRET: "ci-build-only-not-a-real-secret"
          NEXTAUTH_URL: "https://forgecut.app"
        run: |
          npx prisma generate
          npm run build
      # Bundles worker/index.ts the exact same way the Dockerfile's builder stage
      # does (esbuild, not tsc) -- catches a broken worker bundle (e.g. an import
      # esbuild can't resolve, or a native-binding package that needs a new
      # --external entry) here, on a fast CI runner, instead of mid-deploy when
      # `docker build` runs the same command on the VPS. No env vars needed:
      # esbuild only statically bundles imports, it never executes app code.
      - name: Worker build
        run: npm run build:worker
      # Mocked-DB tests: covers job runners, credit ledger, Stripe webhook
      # handling (signature verification, idempotency), the /api/internal/metrics
      # route, admission control, demo quotas, cost tracking, etc. Fast, no
      # external services.
      - name: Unit tests
        run: npm test
      # Real PostgreSQL (via the embedded-postgres package -- a real local
      # binary, not a mock), separate connections, genuine concurrent
      # transactions: proves queue-claiming, lease fencing, worker admission,
      # and demo-quota enforcement are actually race-safe, and that
      # `prisma migrate deploy` succeeds against a clean database and
      # produces a schema identical to `db push`. See lib/testing/
      # integration-global-setup.ts for why this never touches a real
      # DATABASE_URL. A regression here (e.g. someone reintroducing a
      # check-then-act race, or a migration that doesn't apply cleanly)
      # fails the deploy gate the same as a broken build would.
      - name: PostgreSQL integration tests
        run: npm run test:integration

  deploy:
    needs: build-check
    # Only an actual push to main deploys. This also means workflow_dispatch
    # alone no longer triggers a real deploy (previously it did, regardless
    # of which ref was selected, since the deploy step always pulls
    # origin/main on the VPS itself) -- re-add a workflow_dispatch path
    # deliberately if a manual "redeploy main" button is wanted back; don't
    # let it be an accidental side effect of adding the pull_request trigger
    # above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/clipforge
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            # Caddy bind-mounts a single file; git's atomic rename leaves it bound
            # to the old inode unless force-recreated (see OPERATIONS.md #17).
            docker compose up -d --force-recreate caddy
            docker image prune -f

      - name: Post-deploy health check
        id: healthcheck
        run: |
          sleep 10
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" https://forgecut.app/api/health --max-time 15 || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: health check returned $CODE, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after deploy:"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Alert on failed post-deploy health check
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          curl -sS -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"Clipforge <onboarding@resend.dev>\",\"to\":\"support@forgecut.app\",\"subject\":\"Clipforge: deploy succeeded but health check failed\",\"html\":\"<p>The deploy step completed but <code>/api/health</code> did not return 200 within 60s afterward. Check the VPS directly.</p>\"}" \
            --max-time 15 || true
