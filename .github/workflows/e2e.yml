name: E2E (cross-browser)

# Runs the full Playwright suite against staging on a real Linux runner --
# this is what actually verifies Firefox, since it cannot launch at all on
# the Windows machine this suite was originally developed on (spawn UNKNOWN,
# survives a forced reinstall -- a local tooling limitation, not something
# about the app). Firefox is not considered verified until it's green here.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      acceptance_mode:
        description: "Run the normal suite or the credit-spending full Business acceptance journey"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - full

env:
  E2E_BASE_URL: https://clipforge-v2-staging.up.railway.app

# Staging is one shared environment, and every push to this branch redeploys
# it (Railway's git-sync). Two overlapping E2E runs would mean the second
# run's Playwright suite could execute mid-deploy or against a build that a
# third, newer push has already started replacing -- neither failure nor
# success would mean anything. Keyed on the ref (not run id) so a new push
# to the same PR branch cancels an in-flight run for the old commit rather
# than letting both race against the one staging deployment.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Confirms staging is actually running *this* commit before any Playwright
  # test executes against it -- closes the gap where the suite tested a
  # fixed URL without ever proving which build was behind it. Uses
  # /api/version, which exposes only RAILWAY_GIT_COMMIT_SHA (safe deploy
  # metadata, not a secret) -- never Railway's variable-listing API, which
  # returns full plaintext for every env var on the service.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    outputs:
      sha: ${{ steps.wait.outputs.sha }}
    steps:
      - name: Determine expected commit SHA
        id: expected
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for staging health, then for this exact commit to be deployed
        id: wait
        env:
          EXPECTED_SHA: ${{ steps.expected.outputs.sha }}
        run: |
          echo "Waiting for $E2E_BASE_URL to be healthy and report gitSha=$EXPECTED_SHA"
          DEADLINE=$((SECONDS + 480))
          LAST_SEEN="(no response yet)"
          while [ $SECONDS -lt $DEADLINE ]; do
            RESPONSE=$(curl -sS --max-time 10 "$E2E_BASE_URL/api/version" || echo "")
            if [ -n "$RESPONSE" ]; then
              ACTUAL_SHA=$(echo "$RESPONSE" | jq -r '.gitSha // empty' 2>/dev/null || echo "")
              if [ -n "$ACTUAL_SHA" ]; then
                LAST_SEEN="$ACTUAL_SHA"
                if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
                  echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
                  echo "Staging is healthy and running the expected commit ($ACTUAL_SHA)."
                  exit 0
                fi
              fi
            fi
            sleep 10
          done
          echo "::error::STAGING_SHA_MISMATCH -- expected $EXPECTED_SHA, staging last reported '$LAST_SEEN' after 8 minutes of polling."
          exit 1

      # Fail before installing four browser engines if any first-party
      # showcase endpoint cannot read its configured object. These URLs stay
      # on the app origin and stream through authenticated storage access;
      # CI never curls a provider-specific presigned URL.
      - name: Verify all showcase endpoints support metadata and byte ranges
        run: |
          for NAME in script repurpose ugc; do
            URL="$E2E_BASE_URL/api/showcase/$NAME"
            HEADERS=$(curl -fsSI --max-time 20 "$URL")
            echo "$HEADERS" | grep -qi '^content-type: video/mp4' || {
              echo "::error::$NAME showcase HEAD did not return video/mp4"
              exit 1
            }
            LENGTH=$(echo "$HEADERS" | awk -F': ' 'tolower($1)=="content-length" {gsub("\r", "", $2); print $2}')
            if ! [[ "$LENGTH" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::$NAME showcase has missing or zero content-length"
              exit 1
            fi

            STATUS=$(curl -sS -o /tmp/showcase-range.bin -w '%{http_code}' --max-time 20 -H 'Range: bytes=0-1' "$URL")
            if [ "$STATUS" != "206" ] || [ "$(wc -c < /tmp/showcase-range.bin)" -ne 2 ]; then
              echo "::error::$NAME showcase Range GET failed (status=$STATUS)"
              exit 1
            fi
            echo "$NAME showcase is readable ($LENGTH bytes, Range GET 206)."
          done

  e2e:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browser + OS deps for this project
        run: npx playwright install --with-deps ${{ matrix.project == 'mobile-chrome' && 'chromium' || matrix.project }}
      - name: Run E2E suite (${{ matrix.project }})
        # The real-render demo test is excluded from the matrix run: it's
        # already proven per-browser is unnecessary (the same backend path
        # is exercised regardless of which engine drives the browser) and
        # burning through the shared per-IP daily demo quota once per matrix
        # leg would eventually 429 later legs for no new signal. It still
        # runs in the chromium leg alone, see the second step below.
        run: npx playwright test --project=${{ matrix.project }} --grep-invert "submits, renders, and plays back|@authenticated"
      - name: Run the real-render demo test (chromium only)
        # !cancelled() (not the default implicit success()): a plain `if:`
        # skips the step the moment any earlier step in the job fails, which
        # meant an unrelated accessibility/keyboard failure in the main
        # suite silently hid whether real generation still works at all --
        # the two are independent signals and neither should mask the
        # other. Only a genuinely cancelled run should skip this.
        if: ${{ !cancelled() && matrix.project == 'chromium' }}
        run: npx playwright test --project=chromium --grep "submits, renders, and plays back"
      - name: Upload trace/report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  authenticated-e2e:
    name: Authenticated Business journey
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_AUTHENTICATED_RUN: "true"
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify authenticated Business user journey
        # No report, trace, screenshot, or video is uploaded for this job.
        # The test is intentionally non-destructive: it verifies access and
        # controls without spending credits or creating persistent jobs.
        run: npx playwright test tests/e2e/authenticated-journey.spec.ts --project=chromium

  full-acceptance:
    name: Full Business acceptance
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance_mode == 'full' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_AUTHENTICATED_RUN: "true"
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify all paid Business feature lifecycles
        run: npx playwright test tests/e2e/full-acceptance.spec.ts --project=chromium
