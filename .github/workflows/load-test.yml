name: Load test (staging)

# Runs the k6 scenarios from tests/load/ against staging using the official
# k6 GitHub Action -- not dependent on any local machine having k6 installed
# (which is a real, separate limitation: it needs admin elevation on the
# Windows dev machine this repo was worked on, unrelated to whether the app
# itself is fine). public-browsing.js needs no test account and always runs.
# The other 3 scenarios need a seeded staging test account's credentials --
# they run only once TEST_USER_EMAIL/TEST_USER_PASSWORD exist as repo
# secrets (an owner action: adding a real secret), and are silently skipped
# (not failed) until then, since running is exactly what "owner adds a
# secret" is supposed to unblock, not something this workflow can force.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Which scenario to run"
        required: true
        default: "public-browsing"
        type: choice
        options:
          - public-browsing
          - authenticated-dashboard
          - generation-burst
          - mixed-load
          - spike-recovery
          - all

env:
  BASE_URL: https://clipforge-v2-staging.up.railway.app

jobs:
  public-browsing:
    if: ${{ github.event.inputs.scenario == 'public-browsing' || github.event.inputs.scenario == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run public-browsing.js (100 users, 30 min soak)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/public-browsing.js
        env:
          BASE_URL: ${{ env.BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary-public-browsing
          path: summary.json
          if-no-files-found: ignore

  authenticated-scenarios:
    if: ${{ github.event.inputs.scenario != 'public-browsing' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [authenticated-dashboard, generation-burst, mixed-load, spike-recovery]
    steps:
      - uses: actions/checkout@v4
      - name: Check for a seeded staging test account
        id: has-account
        run: |
          if [ -n "${{ secrets.TEST_USER_EMAIL }}" ] && [ -n "${{ secrets.TEST_USER_PASSWORD }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping ${{ matrix.scenario }} -- needs TEST_USER_EMAIL/TEST_USER_PASSWORD repo secrets for a seeded staging test account. This is an owner action (Settings -> Secrets -> Actions), not something this workflow can self-provision."
          fi
      - name: Run ${{ matrix.scenario }}.js
        if: |
          steps.has-account.outputs.ready == 'true' &&
          (github.event.inputs.scenario == matrix.scenario || github.event.inputs.scenario == 'all')
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/${{ matrix.scenario }}.js
        env:
          BASE_URL: ${{ env.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.has-account.outputs.ready == 'true'
        with:
          name: k6-summary-${{ matrix.scenario }}
          path: summary.json
          if-no-files-found: ignore
