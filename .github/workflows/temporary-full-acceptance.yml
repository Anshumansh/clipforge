name: Temporary full staging acceptance

on:
  push:
    branches:
      - acceptance/full-site

env:
  E2E_BASE_URL: https://clipforge-v2-staging.up.railway.app

concurrency:
  group: temporary-full-staging-acceptance
  cancel-in-progress: true

jobs:
  full-acceptance:
    name: Full Business acceptance (temporary trigger)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_AUTHENTICATED_RUN: "true"
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - name: Verify the intended staging build
        env:
          EXPECTED_SHA: 3d53d021ba2c4df21be9850635991ed40b162bbf
        run: |
          RESPONSE=$(curl -fsS --max-time 15 "$E2E_BASE_URL/api/version")
          ACTUAL_SHA=$(echo "$RESPONSE" | jq -r '.gitSha // empty')
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || {
            echo "::error::Staging SHA mismatch: expected $EXPECTED_SHA, got $ACTUAL_SHA"
            exit 1
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify all paid Business feature lifecycles
        run: npx playwright test tests/e2e/full-acceptance.spec.ts --project=chromium
